version: '1.0'
name: CI
displayName: CI

triggers:
  push:
    branches:
      include:
        - master
  pull_request:
    branches:
      include:
        - master

pipeline:
  - test:
      name: test
      displayName: Build & Test
      steps:
        - run: npm install -g pnpm@latest
        - run: pnpm install
        - run: pnpm run build
        - run: pnpm run test
