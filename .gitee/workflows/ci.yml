version: '1.0'
name: CI
displayName: Gitee Go CI

triggers:
  push:
    branches:
      include:
        - master
  pull_request:
    branches:
      include:
        - master

agent:
  label: ubuntu-latest

stages:
  - name: lint
    displayName: Lint
    jobs:
      - name: lint
        displayName: Run lint
        steps:
          - uses: actions/checkout@v4
          - run: |
              corepack enable
              corepack prepare pnpm@latest --activate
          - run: pnpm install
          - run: pnpm run lint

  - name: build
    displayName: Build
    jobs:
      - name: build
        displayName: Run build
        steps:
          - uses: actions/checkout@v4
          - run: |
              corepack enable
              corepack prepare pnpm@latest --activate
          - run: pnpm install
          - run: pnpm run build

  - name: test
    displayName: Test
    dependsOn: build
    jobs:
      - name: test
        displayName: Run tests
        steps:
          - uses: actions/checkout@v4
          - run: |
              corepack enable
              corepack prepare pnpm@latest --activate
          - run: pnpm install
          - run: pnpm run build
          - run: pnpm run test
