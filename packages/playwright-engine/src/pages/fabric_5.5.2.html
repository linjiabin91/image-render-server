<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
  @font-face {
    font-family: 'AlibabaPuHuiTi-3-45-Light';
    src: url('../../../core/fonts/AlibabaPuHuiTi-3-45-Light.woff2') format('woff2');
  }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas#renderCanvas { display: block; }
  </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script src="fabric/5.5.2/fabric.min.js"></script>
<script>
/**
 * fabric5 渲染页面入口
 *
 * 接收 {options, templateJson, cacheKey}，使用 fabric 5.5.2 StaticCanvas 渲染。
 * 首次调用或 cacheKey 变更时全量 loadFromJSON；
 * 相同 cacheKey 时走增量更新（dirty region），跳过已渲染对象的重建。
 *
 * 要求：
 * - 使用 fabric.StaticCanvas（轻量化，无交互）
 * - canvas 固定 id="renderCanvas"
 * - 增量更新时仅更新 text/src 变更对象，不重建画布
 *
 * @param {Object} params
 * @param {Object} params.options - 渲染配置 {width, height, pixelRatio, ...}
 * @param {Object} params.templateJson - 变量替换后的 Fabric JSON
 * @param {string} params.cacheKey - 模板 MD5，用于增量更新判断
 */

// ── CSS 约束修正 ──────────────────────────────────────────────────────────

/**
 * 修正图片大小约束：当模板设置的 width/height 远小于图片自然尺寸时，
 * 将图片设为自然分辨率，通过 scaleX/scaleY 保持显示大小不变。
 *
 * 避免浏览器使用低分辨率 CSS 尺寸渲染大图导致的锯齿/模糊。
 *
 * @param {Object} obj - 图片对象的 JSON 描述
 * @param {HTMLImageElement} imgEl - 已加载的图片元素
 */
function normalizeImageOptions(obj, imgEl) {
  if (!obj || !imgEl) return;
  var elemW = imgEl.naturalWidth || imgEl.width || 0;
  var elemH = imgEl.naturalHeight || imgEl.height || 0;
  if (elemW === 0 || elemH === 0) return;

  var optW = Number(obj.width) || 0;
  var optH = Number(obj.height) || 0;
  if (optW === 0 || optH === 0) return;

  var scaleX = Number(obj.scaleX) || 1;
  var scaleY = Number(obj.scaleY) || 1;

  // 仅当模板设定了远小于自然尺寸的宽高，且 scaleX/Y 相近（非故意变形）时修正
  if (optW < elemW * 0.9 && optH < elemH * 0.9 && Math.abs(scaleX - scaleY) / Math.max(scaleX, scaleY) < 0.01) {
    var displayW = optW * scaleX;
    var displayH = optH * scaleY;
    obj.width = elemW;
    obj.height = elemH;
    obj.scaleX = displayW / elemW;
    obj.scaleY = displayH / elemH;
  }
}

// ── Fabric Image.fromObject 拦截 ───────────────────────────────────────────
//
// 拦截 fabric.Image.fromObject，不再强制 crossOrigin。
// 始终使用 page.screenshot() 截图，canvas 跨域污染不影响截图。
// 仅拦截以应用 normalizeImageOptions（CSS 约束修正）。

(function () {
  fabric.Image.fromObject = function (obj, callback) {
    // clone 避免修改传入对象
    var object = fabric.util.object.clone(obj);
    // 不传 crossOrigin，由浏览器默认行为加载（无 CORS），
    // 避免 OBS 等存储因 CORS 失败导致图片加载失败
    fabric.util.loadImage(object.src, function (img, isError) {
      if (isError || !img) {
        callback && callback(null, true);
        return;
      }
      normalizeImageOptions(object, img);
      var imgInstance = new fabric.Image(img, object);
      callback && callback(imgInstance, false);
    }, null, null);
  };
})();

/** @type {fabric.StaticCanvas|null} */
let _canvas = null;
/** @type {string|null} */
let _cacheKey = null;

async function draw(params) {
  await document.fonts.load("12px \"AlibabaPuHuiTi-3-45-Light\"");
  const { options, templateJson, cacheKey } = params;
  const pixelRatio = options.pixelRatio || 1;
  const width = Math.ceil(options.width * pixelRatio);
  const height = Math.ceil(options.height * pixelRatio);

  // ── 1. 初始化/调整画布 ──────────────────────────────────────────
  const canvasEl = document.getElementById('renderCanvas');

  // 物理像素尺寸（含 pixelRatio）
  canvasEl.width = width;
  canvasEl.height = height;

  // CSS 显示尺寸（逻辑像素）
  canvasEl.style.width = (options.width) + 'px';
  canvasEl.style.height = (options.height) + 'px';

  if (!_canvas) {
    // 首次：创建 StaticCanvas
    _canvas = new fabric.StaticCanvas(canvasEl, {
      width,
      height,
      enableRetinaScaling: false,  // 必关
      imageSmoothing: true,
      renderOnAddRemove: false,    // 必关（手动renderAll）
    });
  } else {
    // 复用：更新尺寸
    _canvas.setDimensions({ width, height });
  }

  // ── 2. 加载/更新内容 ──────────────────────────────────────────
  var objectsLen = _canvas.getObjects().length;
  if (cacheKey && cacheKey === _cacheKey && objectsLen > 0) {
    console.log('[draw] CACHE HIT', {cacheKey: cacheKey, _cacheKey: _cacheKey, objects: objectsLen});
    smartUpdate(_canvas, templateJson);
  } else {
    console.log('[draw] CACHE MISS', {cacheKey: cacheKey, _cacheKey: _cacheKey, objects: objectsLen, reason: cacheKey ? (cacheKey === _cacheKey ? 'no objects' : 'key mismatch') : 'no key'});
    _canvas.clear();
    await loadJson(_canvas, templateJson);
    _cacheKey = cacheKey;
  }

  _canvas.renderAll();
  await new Promise(function (resolve) { requestAnimationFrame(resolve); });

  // 全部走 Playwright 截图，不返回像素数据
  return null;
}

/**
 * 全量加载 JSON 到画布
 *
 * loadFromJSON 回调后等待一个 paint frame，
 * 引擎侧还额外等待了 networkidle 做双重保障。
 *
 * @param {fabric.StaticCanvas} canvas
 * @param {Object} json - Fabric JSON
 * @returns {Promise<void>}
 */
function loadJson(canvas, json) {
  return new Promise(function (resolve, reject) {
    try {
      canvas.loadFromJSON(json, function () {
        requestAnimationFrame(resolve);
      });
    } catch (err) {
      reject(err);
    }
  });
}

/**
 * 增量更新 — 按 id/name 匹配画布上已有对象，仅更新变更属性
 *
 * 匹配策略：
 * - 优先按 id 匹配（templateJson 中 objects[i].id 与 canvas 对象 id/name 对比）
 * - 再按索引位置兜底
 *
 * 更新策略（dirty region）：
 * - text 类型 → 只更新 text 属性
 * - image 类型 → 只更新 src 属性（触发浏览器重新加载图片）
 * - 其他类型 → 跳过（结构不变时无需更新）
 *
 * @param {fabric.StaticCanvas} canvas
 * @param {Object} json - 变量替换后的 Fabric JSON
 */
function smartUpdate(canvas, json) {
  const objects = canvas.getObjects();
  const newObjects = json.objects || [];
  let updated = 0;

  for (let i = 0; i < newObjects.length; i++) {
    const obj = newObjects[i];
    const target = objects[i];

    if (!target) continue;

    const targetId = target.id || target.name;
    if (obj.id && targetId && obj.id !== targetId) continue;

    const type = (obj.type || '').toLowerCase();

    if (type.includes('text')) {
      if (obj.text !== target.text) {
        console.log('[smartUpdate] text changed', {id: obj.id, from: target.text, to: obj.text});
        target.set('text', obj.text || '');
        target.set('dirty', true);
        updated++;
      }
    } else if (type === 'image' && obj.src) {
      if (obj.src !== target.getSrc()) {
        console.log('[smartUpdate] image src changed', {id: obj.id, from: target.getSrc()?.slice(0,60), to: obj.src?.slice(0,60)});
        target.setSrc(obj.src, () => {
          target.set('dirty', true);
        });
        updated++;
      }
    }
  }
  console.log('[smartUpdate] done', {total: objects.length, updated});
}
// 全关！！！
fabric.Object.prototype.objectCaching = false;
fabric.Object.prototype.stateful = false;
fabric.Object.prototype.borderColor = '#000';
fabric.Text.prototype.skipCaching = true;
fabric.Text.prototype.originX = 'left';
</script>
</body>
</html>
