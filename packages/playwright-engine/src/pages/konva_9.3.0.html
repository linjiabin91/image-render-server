<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
  @font-face {
    font-family: 'AlibabaPuHuiTi-3-45-Light';
    src: url('../../../core/fonts/AlibabaPuHuiTi-3-45-Light.woff2') format('woff2');
  }


    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #renderContainer { position: relative; }
  </style>
</head>
<body>
<div id="renderContainer"></div>
<script src="konva/9.3.0/konva.min.js"></script>
<script>
/**
 * konva 9.3.0 渲染页面入口
 *
 * 接收 {options, templateJson, cacheKey}，使用 Konva Stage 渲染。
 * 首次调用或 cacheKey 变更时：预加载图片 → 全量重建；
 * 相同 cacheKey 时：走增量更新，仅更新变化的 text/image 属性。
 *
 * Konva 使用 container 创建内部 canvas（与 Leafer/Fabric 不同），
 * 页面只提供 div 容器，Konva 自行管理 canvas 元素。
 *
 * 兼容 tag 和 className 两种节点类型标识：
 * - tag: "Text" | "Image" | "Group"（leafer 格式）
 * - className: "Text" | "Image" | "Group" | "Layer"（fabric 格式）
 *
 * @param {Object} params
 * @param {Object} params.options - 渲染配置 {width, height, pixelRatio, ...}
 * @param {Object} params.templateJson - 变量替换后的模板 JSON
 * @param {string} params.cacheKey - 模板 MD5，用于增量更新判断
 */

// ── 禁用自动重绘 ──────────────────────────────────────────────────────────

Konva.autoDrawEnabled = false;

/** @type {Konva.Stage|null} */
var _stage = null;
/** @type {Konva.Layer|null} */
var _layer = null;
/** @type {string|null} */
var _cacheKey = null;

/** @type {HTMLDivElement|null} */
var _container = null;

// ── 工具函数 ──────────────────────────────────────────────────────────────

/**
 * 获取节点类型 — 兼容 tag 和 className
 */
function getNodeType(node) {
  return (node.tag || node.className || '').toLowerCase();
}

/**
 * 获取图片 URL — 兼容 image、url、fill.url
 */
function getImageUrl(node) {
  if (node.image && typeof node.image === 'string') return node.image;
  if (node.url) return node.url;
  if (node.fill && typeof node.fill === 'object' && node.fill.url) return node.fill.url;
  return undefined;
}

/**
 * 收集模板中所有图片 URL（去重）
 */
function collectImageUrls(json) {
  var urls = [];
  var seen = {};

  function walk(childs) {
    if (!childs || !childs.length) return;
    for (var i = 0; i < childs.length; i++) {
      var child = childs[i];
      var url = getImageUrl(child);
      if (url && !seen[url]) {
        seen[url] = true;
        urls.push(url);
      }
      if (child.children) {
        walk(child.children);
      }
    }
  }

  walk(json.children);
  return urls;
}

/**
 * 预加载图片列表，返回 URL → HTMLImageElement 映射
 */
function preloadImages(urls) {
  if (!urls || urls.length === 0) return Promise.resolve({});

  var promises = urls.map(function (url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () { resolve([url, img]); };
      img.onerror = function () {
        console.warn('[preload] image load failed', url);
        resolve([url, null]);
      };
      img.src = url;
    });
  });

  return Promise.all(promises).then(function (entries) {
    var map = {};
    for (var i = 0; i < entries.length; i++) {
      map[entries[i][0]] = entries[i][1];
    }
    return map;
  });
}

// ── 主入口 ────────────────────────────────────────────────────────────────

async function draw(params) {
  await document.fonts.load("12px \"AlibabaPuHuiTi-3-45-Light\"");
  var options = params.options;
  var templateJson = params.templateJson;
  var cacheKey = params.cacheKey;
  var pixelRatio = options.pixelRatio || 1;
  var width = Math.ceil(options.width * pixelRatio);
  var height = Math.ceil(options.height * pixelRatio);

  // ── 1. 初始化 Stage ───────────────────────────────────────────
  // Konva 使用 container div 创建内部 canvas，不要使用 canvas 元素作为 container
  if (!_stage) {
    _container = document.getElementById('renderContainer');
    _stage = new Konva.Stage({
      container: _container,
      width: width,
      height: height,
    });
    _layer = new Konva.Layer();
    _stage.add(_layer);
  } else {
    _stage.width(width);
    _stage.height(height);
  }

  // ── 2. 加载/更新内容 ──────────────────────────────────────────
  var childrenLen = _layer.children ? _layer.children.length : 0;
  if (cacheKey && cacheKey === _cacheKey && childrenLen > 0) {
    console.log('[draw] CACHE HIT', {cacheKey: cacheKey, _cacheKey: _cacheKey, children: childrenLen});

    // CACHE HIT：先预加载可能变化的新图片，再增量更新
    var preloaded = await preloadImages(collectImageUrls(templateJson));
    smartUpdate(_layer, templateJson, preloaded);
  } else {
    console.log('[draw] CACHE MISS', {cacheKey: cacheKey, _cacheKey: _cacheKey, children: childrenLen});

    // CACHE MISS：预加载所有图片，再全量重建
    var preloaded = await preloadImages(collectImageUrls(templateJson));
    _layer.destroyChildren();
    if (templateJson.children) {
      for (var ci = 0; ci < templateJson.children.length; ci++) {
        var childNode = buildNode(templateJson.children[ci], preloaded);
        if (childNode) {
          _layer.add(childNode);
        }
      }
    }
    _cacheKey = cacheKey;
  }

  _layer.draw();
  await new Promise(function (resolve) { requestAnimationFrame(resolve); });
  return null;
}

// ── 节点构建（图片已预加载）─────────────────────────────────────────────

/**
 * 递归构建 Konva 节点
 *
 * @param {Object} node - 模板节点
 * @param {Object} preloaded - URL → HTMLImageElement 映射
 */
function buildNode(node, preloaded) {
  var type = getNodeType(node);
  if (type === 'text') {
    return buildTextNode(node);
  }
  if (type === 'image') {
    return buildImageNode(node, preloaded);
  }
  if (type === 'group' || type === 'layer') {
    var group = new Konva.Group({
      x: node.x || 0,
      y: node.y || 0,
      width: node.width,
      height: node.height,
    });
    if (node.children) {
      for (var ci = 0; ci < node.children.length; ci++) {
        var childNode = buildNode(node.children[ci], preloaded);
        if (childNode) {
          group.add(childNode);
        }
      }
    }
    return group;
  }
  return null;
}

/**
 * 构建 Konva.Text 节点
 */
function buildTextNode(node) {
  var config = {
    x: node.x || 0,
    y: node.y || 0,
    text: node.text || '',
    fontSize: node.fontSize || 16,
    fontFamily: node.fontFamily || 'sans-serif',
    fill: typeof node.fill === 'string' ? node.fill : '#333',
  };
  if (node.width !== undefined) config.width = node.width;
  if (node.height !== undefined) config.height = node.height;
  return new Konva.Text(config);
}

/**
 * 构建 Konva.Image 节点
 *
 * @param {Object} node - 模板节点
 * @param {Object} preloaded - URL → HTMLImageElement 映射
 */
function buildImageNode(node, preloaded) {
  var imgUrl = getImageUrl(node);
  if (!imgUrl) return null;

  var imgEl = preloaded ? preloaded[imgUrl] : null;
  if (!imgEl) {
    console.warn('[build] image not preloaded', imgUrl);
    return null;
  }

  var config = {
    x: node.x || 0,
    y: node.y || 0,
    image: imgEl,
  };
  if (node.width !== undefined) config.width = node.width;
  if (node.height !== undefined) config.height = node.height;
  return new Konva.Image(config);
}

// ── 增量更新 ──────────────────────────────────────────────────────────────

/**
 * 增量更新 — 按数组索引匹配，仅更新变动的 text/image 属性
 *
 * 前置 cache hit 保证数据结构一致。
 * 递归处理嵌套子节点（Group/Layer）。
 */
function smartUpdate(layer, json, preloaded) {
  var existing = layer.children || [];
  var newChildren = json.children || [];
  smartUpdateChildren(existing, newChildren, preloaded);
}

function smartUpdateChildren(existing, newChildren, preloaded) {
  var len = Math.min(existing.length, newChildren.length);
  var updated = 0;
  for (var i = 0; i < len; i++) {
    var target = existing[i];
    var node = newChildren[i];
    if (!target || !node) continue;

    var nodeType = getNodeType(node);
    var targetClass = target.getClassName();

    if (nodeType === 'text' && targetClass === 'Text') {
      if (target.text() !== node.text) {
        console.log('[smartUpdate] text changed', {index: i, from: target.text(), to: node.text});
        target.text(node.text || '');
        updated++;
      }
    } else if (nodeType === 'image' && targetClass === 'Image') {
      var newUrl = getImageUrl(node);
      var currentUrl = target.__url;
      if (newUrl !== undefined && newUrl !== currentUrl) {
        console.log('[smartUpdate] image changed', {index: i, from: currentUrl, to: newUrl});
        var imgEl = preloaded ? preloaded[newUrl] : null;
        if (imgEl) {
          target.image(imgEl);
          target.__url = newUrl;
          updated++;
        }
      }
    }

    // 递归处理 Group/Layer 子节点
    var targetChildren = target.children;
    var nodeChildren = node.children;
    if (targetChildren && targetChildren.length > 0 && nodeChildren && nodeChildren.length > 0) {
      smartUpdateChildren(targetChildren, nodeChildren, preloaded);
    }
  }
  console.log('[smartUpdate] done', {total: existing.length, updated: updated});
}
</script>
</body>
</html>
