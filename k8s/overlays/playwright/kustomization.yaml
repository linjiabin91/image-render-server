apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: playwright-

images:
  - name: image-render-server
    newName: image-render-server
    newTag: playwright

patches:
  - target:
      kind: Service
      name: image-render-server
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 3003
      - op: replace
        path: /spec/ports/0/targetPort
        value: 3000
