apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-render-server
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: image-render-server
  template:
    metadata:
      labels:
        app: image-render-server
    spec:
      containers:
        - name: image-render-server
          # 通过 overlay 替换 image
          image: image-render-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: image-render-server-config
                  key: LOG_LEVEL
            - name: IMAGE_FETCH_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: image-render-server-config
                  key: IMAGE_FETCH_TIMEOUT
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
